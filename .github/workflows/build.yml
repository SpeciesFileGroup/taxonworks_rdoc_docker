name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    defaults:
      run:
        working-directory: app

    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler-cache: true
          working-directory: app

      - name: Test
        run: bundle exec ruby -Itest test/docs_builder_test.rb

      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Build Docker image
        working-directory: .
        run: docker build --pull . -t taxonworks-rdoc-server:ci --build-arg BUNDLER_WORKERS=3

      - name: Smoke-test documentation generation
        working-directory: .
        run: |
          docker run --detach --name taxonworks-rdoc-smoke \
            --memory 512m \
            --publish 127.0.0.1:4567:4567 \
            --env REBUILD_TOKEN=ci-smoke-token \
            taxonworks-rdoc-server:ci

          for attempt in $(seq 1 120); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4567/; then
              curl --fail --silent --output /dev/null http://127.0.0.1:4567/css/common.css
              exit 0
            fi

            echo "Waiting for documentation build (${attempt}/120)"

            if [ "$(docker inspect --format '{{.State.Running}}' taxonworks-rdoc-smoke)" != true ]; then
              docker logs taxonworks-rdoc-smoke
              exit 1
            fi

            sleep 10
          done

          docker logs taxonworks-rdoc-smoke
          exit 1

      - name: Stop smoke-test container
        if: always()
        working-directory: .
        run: docker rm --force taxonworks-rdoc-smoke 2>/dev/null || true

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          docker tag taxonworks-rdoc-server:ci sfgrp/taxonworks_rdoc_docker:latest
          docker push sfgrp/taxonworks_rdoc_docker:latest
